server:
  adminMinThreads: 1
  adminMaxThreads: 64
  applicationConnectors:
    - type: http
      port: 8090
  adminConnectors:
    - type: http
      port: 8089
defaultSize: 5
llm:
  # LOCAL = Ollama / llama.cpp on this machine, REMOTE = hosted provider (apiKey mandatory)
  type: LOCAL
  baseUrl: http://localhost:11434/v1
#  modelName: hf.co/unsloth/Llama-3.2-1B-Instruct-GGUF:UD-Q4_K_XL
  # Ollama defaults every model to a 4096 token context and ignores num_ctx sent over the
  # OpenAI-compatible endpoint, so the window has to be baked into the model tag:
  #   ollama create qwen3.5-9b-32k --from qwen3.5-9b --parameter num_ctx 32768
  # A merge request review prompt runs past 5000 tokens, which does not fit in 4096.
  modelName: qwen3.5-9b-32k
  apiKey: not-needed
  temperature: 0.0
  timeoutSeconds: 300
  # cap on the answer length; without it the server default can cut the answer short
  maxTokens: 4096
  # qwen3.5 is a thinking model: left on, it spends the whole answer budget on reasoning and
  # returns empty content. The MCP tool already did the analysis, so thinking buys nothing here.
  reasoningEffort: none
  maxMemoryMessages: 50
  # a small model that has its tool calls refused will otherwise keep calling them
  maxToolCallingRoundTrips: 5
  logRequests: false
  logResponses: false
mcpClient:
  enabled: true
  url: http://localhost:9088/mcp
  key: langchain-mcp-server
  timeoutSeconds: 30
  logRequests: false
  logResponses: false
swagger:
  resourcePackage: com.langchain.central.resource
logging:
  level: INFO
  loggers:
    com.langchain: INFO
    org.hibernate: DEBUG
  appenders:
    - type: console
      threshold: INFO
      timeZone: IST
      logFormat: "%(%-5level) %X{X-TRACE-ID}  %X{span_id} [%date] [%thread] [%logger{0}]: %message%n"